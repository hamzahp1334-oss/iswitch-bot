services:
  # Render Web Service (Free Tier compatible with automatic healthcheck)
  - type: web
    name: iswitch-telegram-bots
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CUSTOMER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        value: "742368838,8798202536"
      - key: TELEGRAM_CHANNEL
        value: "@iSwitch0"
      - key: DATA_DIR
        value: "data"
